[workspace]
members = [ "crates/*" ]
resolver = "2"

[workspace.package]
# name = "runtime-testing-framework"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.99"
futures = "0.3.31"
itertools = "0.14.0"
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features=false, features = ["charset", "http2", "json", "rustls-tls", "system-proxy"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "parking_lot", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

# test dependencies
assert_cmd = "2.0.17"
assert_fs = "1.1.3"
predicates = "3.1.3"
pretty_assertions = "1.4.1"
simple_test_case = "1.3.0"
simple_txtar = "1.1.0"
