[workspace]
members = [ "crates/*" ]
resolver = "2"

[workspace.package]
# name = "runtime-testing-framework"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
apollo-compiler = "1.33.1"
axum = { version = "0.8.9", features = ["macros"] }
bytes = "1.12.1"
cached = { version = "4.0.2", features = ["async"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
envy = "0.4.2"
futures = "0.3.34"
git-version = "0.3.9"
# --- We pin the google cloud versions since they need to be updated in lockstep
google-cloud-auth = { version = "=1.17.0", features = ["idtoken"] }
google-cloud-gax = "=1.15.0"
google-cloud-secretmanager-v1 = "=1.14.0"
google-cloud-storage = "=1.20.0"
# -------------------------------------------------------------------------------
humantime = "2"
indoc = "2.0.8"
itertools = "0.15.0"
k8s-openapi = { version = "0.28.0", features = ["schemars", "v1_35"] }
kube = { version = "4.2.0", default-features=false, features = ["aws-lc-rs", "client", "config", "derive", "runtime", "rustls-tls"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest"] }
# Enables TLS on the reqwest 0.12 that oauth2 uses; its default `rustls-tls`
# feature would pull in ring, which deny.toml bans.
oauth2_reqwest = { package = "reqwest", version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }
open = "5.4.4"
promql-parser = "0.11.1"
rand = { version = "0.10.3", features = ["chacha"] }
reqwest = { version = "0.13.5", default-features=false, features = ["charset", "http2", "json", "rustls", "system-proxy"] }
rustls = "0.23.46"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tikv-jemallocator = { version = "0.7", features = ["background_threads"] }
tokio = { version = "1.54.0", features = ["fs", "macros", "parking_lot", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
xdg = "3.0.0"
yaml_serde = "0.10.7"

# test dependencies
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
insta = "1"
predicates = { version = "3.1.4", features = ["regex"] }
pretty_assertions = "1.4.1"
simple_test_case = "1.3.0"
zip = "9.0.5"
