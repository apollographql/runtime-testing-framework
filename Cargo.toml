[workspace]
members = [ "crates/*" ]
resolver = "2"

[workspace.package]
# name = "runtime-testing-framework"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
apollo-compiler = "1.31.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
indoc = "2.0.7"
itertools = "0.14.0"
k8s-openapi = { version = "0.27.1", features = ["schemars", "v1_35"] }
kube = { version = "3.1.0", features = ["aws-lc-rs", "client", "config", "derive", "runtime"] }
rand = "0.10.1"
reqwest = { version = "0.13.2", default-features=false, features = ["charset", "http2", "json", "rustls", "system-proxy"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "parking_lot", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }

# test dependencies
assert_cmd = "2.2.1"
assert_fs = "1.1.3"
predicates = { version = "3.1.4", features = ["regex"] }
pretty_assertions = "1.4.1"
simple_test_case = "1.3.0"
zip = "8.5.1"
