[workspace]
members = [ "crates/*" ]
resolver = "2"

[workspace.package]
# name = "runtime-testing-framework"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
apollo-compiler = "1.33.0"
axum = { version = "0.8.9", features = ["macros"] }
bytes = "1.12.1"
cached = { version = "2.0.2", features = ["async", "async_tokio_rt_multi_thread"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
envy = "0.4.2"
futures = "0.3.34"
git-version = "0.3.9"
# --- We pin the google cloud versions since they need to be updated in lockstep
google-cloud-auth = { version = "=1.10.0", features = ["idtoken"] }
google-cloud-gax = "=1.10.0"
google-cloud-secretmanager-v1 = "=1.9.0"
google-cloud-storage = "=1.10.0"
# -------------------------------------------------------------------------------
humantime = "2"
indoc = "2.0.7"
itertools = "0.14.0"
k8s-openapi = { version = "0.27.1", features = ["schemars", "v1_35"] }
kube = { version = "3.1.0", default-features=false, features = ["aws-lc-rs", "client", "config", "derive", "runtime", "rustls-tls"] }
oauth2 = "5.0.0"
open = "5.4.4"
promql-parser = "0.10.0"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features=false, features = ["charset", "http2", "json", "rustls", "system-proxy"] }
rustls = "0.23.45"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "parking_lot", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
xdg = "3.0.0"

# test dependencies
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
insta = "1"
predicates = { version = "3.1.4", features = ["regex"] }
pretty_assertions = "1.4.1"
simple_test_case = "1.3.0"
zip = "8.6.0"
