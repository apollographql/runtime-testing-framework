[workspace]
members = [ "crates/*" ]
resolver = "2"

[workspace.package]
# name = "runtime-testing-framework"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.100"
apollo-compiler = "1.31.0"
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
indoc = "2.0.6"
itertools = "0.14.0"
rand = "0.9.2"
reqwest = { version = "0.13.1", default-features=false, features = ["charset", "http2", "json", "rustls", "system-proxy"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "parking_lot", "rt-multi-thread"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# test dependencies
assert_cmd = "2.1.1"
assert_fs = "1.1.3"
predicates = { version = "3.1.3", features = ["regex"] }
pretty_assertions = "1.4.1"
simple_test_case = "1.3.0"
