[tasks.fix-spelling]
run = "typos --write-changes"
dir = "../../"

[tasks.format-markdown]
run = "dprint fmt"
# This changes the working directory for format-markdown to the project root
dir = "../../"

[tasks.generate-docs]
run = "$(git rev-parse --show-toplevel)/scripts/generate-docs.sh"

[tasks.generate-helm-docs]
run = [
    "helm-docs -c crates/rep-orchestrator/helm/rep-orchestrator",
    "dprint fmt crates/rep-orchestrator/helm/rep-orchestrator/README.md",
    "helm-docs -c crates/orchestrator-ui/helm/orchestrator-ui",
    "dprint fmt crates/orchestrator-ui/helm/orchestrator-ui/README.md",
]
dir = "../../"
description = "Generate helm chart README.md files and format with dprint"

[tasks.pr-all]
run = [
    "mise run pr-format",
    "mise run pr-clippy",
    "mise run pr-rustdoc",
    "mise run pr-spell-check",
    "mise run pr-markdown",
    "mise run pr-doc-types",
    "mise run pr-helm-docs",
    "mise run pr-test"
]

[tasks.pr-clippy]
run = "cargo pr-clippy"

[tasks.pr-doc-types]
run = "$(git rev-parse --show-toplevel)/scripts/check-doc-types.sh"
description = "Check documentation diataxis types"

[tasks.pr-helm-docs]
run = "$(git rev-parse --show-toplevel)/scripts/check-helm-docs.sh"
description = "Check that helm chart README.md is in sync with values.yaml"

[tasks.pr-rustdoc]
run = "RUSTDOCFLAGS=\"-D warnings -D rustdoc::broken-intra-doc-links\" cargo doc --all-features --workspace --no-deps"

[tasks.pr-format]
run = "cargo pr-format"

[tasks.pr-markdown]
run = "dprint check"
# This changes the working directory for pr-markdown to the project root
dir = "../../"

[tasks.pr-spell-check]
run = "typos"
dir = "../../"

[tasks.pr-test]
run = "cargo test"

[tools]
"cargo:cargo-edit" = "0.13.9"
"cargo:cargo-expand" = "1.0.121"
"cargo:cargo-llvm-cov" = "0.8.4"
"cargo:typos-cli" = "1.44.0"
dprint = "0.54.0"
"helm-docs" = "1.14.2"
mdbook = "0.5.2"
rust = "1.96.0"

[env]
_.file = '../../.env'
