name: router-scale-wrapper
description: |
  Start a router scale test from a local machine. This will create the VM and rsync 
  over RTF and the required config to run a router-scale test to the VM.

values:
  # This has been deliberately set with an int so it will fail if you try to run without replacing this.
  # This should be overriden using the --value(s) flag on the CLI
  vm_name_suffix: 1
  delete_vm: "true"
  test_plan_dir: "example-test-plans/router-scale-response-caching/router-perf"
  # This has been deliberately set with an int so it will fail if you try to run without replacing this.
  # This should be the absolute path to your local dir containing RTF
  abs_path_rtf_repo: 1

scenario:
  inline:
    name: scenario-router-scale
    description: "Sync RTF files over to VM and run router-scale"

    values:
      - name: vm_name
        description: The name of the router-scale VM being targeted
      - name: abs_path_rtf_repo
        description: The absolute path to the rtf repo. This is needed so that rtf itself can be rsync'd to the VM.
      - name: test_plan_dir
        description: Directory containing the test plan to run

    command:
      name: sync-files-to-vm.sh
      kind: relative_path
      path: scripts/sync-files-to-vm.sh
      args:
        - "{{ vm_name }}"
        - "{{ test_plan_dir }}"

    env_vars:
      RTF_DIR: "{{ abs_path_rtf_repo }}"

    file_providers:
      - name: gcloud-ssh-wrapper.sh
        env_var: GCLOUD_SSH_WRAPPER
        kind: relative_path
        path: scripts/gcloud-ssh-wrapper.sh

      - name: bootstrap-env.sh
        env_var: BOOTSTRAP_ENV
        kind: relative_path
        path: scripts/bootstrap-env.sh

      - name: run-test-plan.sh
        env_var: INSTALL_RTF
        kind: relative_path
        path: scripts/run-test-plan.sh

      - name: values.json
        env_var: VALUES
        kind: resolved_values

environment:
  inline:
    name: environment-router-scale
    description: "Create a router-scale VM and delete it"

    values:
      - name: vm_name_suffix
        description: The suffix of the name of the router-scale VM being created. This will be prefixed with "rtf-".
      - name: abs_path_rtf_repo
        description: The absolute path to the rtf repo. This is needed so that the VM can be cleaned up.
      - name: delete_vm
        description: |
          A flag to set whether the VM should be deleted at the end of the run.
          To delete the VM, this must be set to "true".
          If not deleted, the VM will be cleaned up to remove sensitive data.

    setup:
      command:
        name: create-router-scale-vm.sh
        kind: relative_path
        path: scripts/create-router-scale-vm.sh
        args:
          - "{{ vm_name_suffix }}"

      provides:
        - name: vm_name
          description: The full name of the router-scale VM that was created.

    teardown:
      command:
        name: cleanup-router-scale-vm.sh
        kind: relative_path
        path: scripts/cleanup-router-scale-vm.sh
        args:
          - "{{ vm_name }}"
          - "{{ delete_vm }}"
