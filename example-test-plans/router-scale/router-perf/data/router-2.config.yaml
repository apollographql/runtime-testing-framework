supergraph:
  introspection: true
  path: /{*wildcard}
  defer_support: true
  experimental_log_on_broken_pipe: true
  query_planning:
    warmed_up_queries: 4000
    experimental_reuse_query_plans: true
    cache:
      in_memory:
        # DIMENSION: query plan cache: none (1) vs 500
        limit: 1 # no cache
        # limit: 500 # upto 500 query plans are cached

health_check:
  listen: 127.0.0.1:4000
  enabled: true
headers:
  all:
    request:
      - propagate:
          matching: ".*"
traffic_shaping:
  all:
    deduplicate_query: true

  # DIMENSION: use traffic shaping
  # router:
    # timeout: 1s
    # concurrency_limit: 100
    # global_rate_limit:
      # capacity: 500
      # interval: 1s

include_subgraph_errors:
  all: true
cors:
  allow_any_origin: true
plugins:
  experimental.expose_query_plan: true
homepage:
  enabled: false
demand_control:
  enabled: false
  mode: measure
  strategy:
    static_estimated:
      list_size: 10
      max: 1000

# DIMENSION: add connectors
# preview_connectors:
#   subgraphs:
#     posts:
#       sources:
#         jsonPlaceholder:
#           override_url: http://127.0.0.1:5280 # This port must match the snapshot for this source above

telemetry:
  apollo:
    otlp_tracing_sampler: always_off
    field_level_instrumentation_sampler: 0.1
    send_headers:
      except: ["X-Forwarded-For", "Cookie", "From", "client-ip", "authorization"]
  instrumentation:
    instruments:
      default_requirement_level: required
      router:
        http.server.request.duration: true
        http.server.active_requests:
          attributes:
            http.request.method: true
      subgraph:
        http.client.request.duration:
          attributes:
            subgraph.name: true
    spans:
      default_attribute_requirement_level: required
      mode: spec_compliant
      router:
        attributes:
          http.request.method: true
          http.response.status_code: true
          user_agent.original: true
          error.type: true
          dd.trace_id: true
      supergraph:
        attributes:
          graphql.document: true
          graphql.operation.name: true
          graphql.operation.type: true
      subgraph:
        attributes:
          subgraph.name: true
          subgraph.graphql.operation.type: true
    # events:
    #   supergraph:
    #     logging:
    #       message: "graphql.document"
    #       level: info
    #       on: event_response
    #       attributes:
    #         cost.actual: true
    #         cost.estimated: true
    #         cost.delta: true
  exporters:
    tracing:
      common:
        service_name: "router_scale_tracing_service"
        sampler: 1
        resource:
          version: "router_scale_tracing_version"
        preview_datadog_agent_sampling: true
      otlp:
        enabled: true
        endpoint: "127.0.0.1:4317"
        batch_processor:
          scheduled_delay: 20ms
          max_concurrent_exports: 100
          max_export_batch_size: 5000
          max_export_timeout: 5s
          max_queue_size: 5000
    metrics:
      otlp:
        enabled: true
        endpoint: default
        protocol: grpc
        batch_processor:
          scheduled_delay: 20ms
          max_concurrent_exports: 100
          max_export_batch_size: 5000
          max_export_timeout: 5s
          max_queue_size: 5000
      prometheus:
        enabled: true
        listen: 127.0.0.1:9090
        path: /metrics
