name: router-perf-scenario
description: |
  Expects to be executed on a GCP VM as part of a router-scale test. This
  scenario makes use of vegeta to run a simple perf test against a running
  router.

values:
  - name: random_seed
    description: "A random seed to use for shuffling the canned operations we run"
  - name: rps
    description: "The requests per second to run vegeta at"
  - name: duration_secs
    description: "The number of seconds to run vegeta for"
  - name: graph_ref
    description: "The graphos graph ref to pull operations for"
  - name: top_n
    description: "The number of operations to pull"

command:
  name: vegeta-perf-test.sh
  kind: relative_path
  path: scripts/vegeta-perf-test.sh

env_vars:
  RPS: "{{ rps }}"
  DURATION_SECS: "{{ duration_secs }}"
  RANDOM_SEED: "{{ random_seed }}"

file_providers:
  - name: canned_ops.json
    env_var: CANNED_OPS_FILE
    kind: graphos_canned_ops
    graph_ref: "{{ graph_ref }}"
    top_n: "{{ top_n }}"
    skip_mutations: true
