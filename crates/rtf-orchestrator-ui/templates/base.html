<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}RTF Status{% endblock %}</title>
    <link rel="icon" type="image/png" href="/ui/static/gongphin.png" />
    <script src="/ui/static/htmx.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            color: #1a1a1a;
            background: #f6f7f9;
        }

        header {
            background: #14181f;
            color: #fff;
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: inherit;
            text-decoration: none;
        }

        header .logo {
            height: 2rem;
            width: 2rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .status {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status--pending {
            background: #e2e5ea;
            color: #33383f;
        }

        .status--active {
            background: #cfe3ff;
            color: #0b4a80;
        }

        .status--success {
            background: #d6f5d6;
            color: #1a6b1a;
        }

        .status--failed {
            background: #ffd6d6;
            color: #8a1f1f;
        }

        .status--unrunnable {
            background: #fff3cd;
            color: #7a5c00;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            text-align: left;
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid #ddd;
        }

        .nowrap {
            white-space: nowrap;
        }

        dt {
            font-weight: 600;
        }

        .copy-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0.1rem 0.3rem;
            vertical-align: middle;
            display: inline-flex;
            align-items: center;
            color: inherit;
        }

        .copy-btn:hover {
            opacity: 0.7;
        }

        .timeline {
            list-style: none;
            padding-left: 0;
        }

        .timeline li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }

        .timeline time {
            color: #666;
            margin-left: 0.5rem;
            font-size: 0.85rem;
        }

        .timeline p {
            margin: 0.35rem 0 0;
        }

        .muted {
            color: #666;
            font-size: 0.85rem;
        }

        .muted button {
            margin-left: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .test-plan-card {
            border: 1px solid #ddd;
            border-radius: 0.375rem;
            padding: 0.85rem 1.1rem;
            margin-bottom: 0.75rem;
        }

        .test-plan-card h3 {
            margin: 0 0 0.35rem;
        }

        .test-plan-card .location {
            overflow-wrap: anywhere;
        }

        [popover] {
            border: 1px solid #ddd;
            border-radius: 0.375rem;
            padding: 1rem 1.25rem;
            max-width: 32rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        pre {
            background: #14181f;
            color: #f6f7f9;
            padding: 0.75rem 1rem;
            border-radius: 0.25rem;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <header>
        <a href="/ui">
            <img class="logo" src="/ui/static/gongphin.png" alt="" />
            <h1>RTF Orchestrator</h1>
        </a>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <script>
        const COPY_BTN_CHECK_ICON = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 8.5 6.5 12 13 4"></polyline></svg>';

        document.addEventListener("click", (event) => {
            const button = event.target.closest(".copy-btn");
            if (!button) return;
            navigator.clipboard.writeText(button.dataset.copy).then(() => {
                const original = button.innerHTML;
                button.innerHTML = COPY_BTN_CHECK_ICON;
                setTimeout(() => {
                    button.innerHTML = original;
                }, 1200);
            });
        });
    </script>
</body>

</html>
