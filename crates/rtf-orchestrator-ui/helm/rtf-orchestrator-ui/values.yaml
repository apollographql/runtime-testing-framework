# -- Application configuration
config:
  # -- Host address the server listens on
  host: "0.0.0.0"
  # -- Port the server listens on
  port: "8080"
  # -- Log level for the RUST_LOG environment variable
  logLevel: "warn"
  # -- Base URL of the orchestrator API the UI reads
  # (e.g. http://rtf-orchestrator:8035). Required
  orchestratorUrl: ""

# -- GCP Cloud Logging deep-link configuration, for the "View logs in GCP" links on each
# execution. No default: every environment must supply real values.
gcpLinks:
  # -- GCP project the workload cluster runs in. Required
  project: ""

# -- Grafana deep-link configuration, for the "View dashboard in Grafana" links on each
# execution. No default: every environment must supply real values.
grafana:
  # -- Base URL of the Grafana instance, no trailing slash (e.g. https://grafana.example.com).
  # Required
  baseUrl: ""
  # -- UID of the dashboard deep links point to. Required
  dashboardUid: ""
  # -- URL slug of the dashboard deep links point to. Required
  dashboardSlug: ""
  # -- UID of the datasource backing the dashboard. Required
  datasourceUid: ""

# -- Overrides the fully qualified app name
fullnameOverride: ""

# -- Container image configuration
image:
  # -- Image repository
  repository: "us-central1-docker.pkg.dev/platform-cross-environment/apollo-private-docker/rtf-orchestrator-ui"
  # -- Image tag. Defaults to the chart appVersion when not set
  tag: null
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- List of image pull secrets
imagePullSecrets: []

# -- Overrides the chart name
nameOverride: ""

# -- Annotations to add to the pod template
podAnnotations: {}

# -- Resource requests and limits for the rtf-orchestrator-ui container
resources: {}

# -- Kubernetes Service configuration
service:
  # -- Whether to create a Service resource
  create: true
  # -- Service port
  port: 8080
  # -- Service type
  type: ClusterIP
