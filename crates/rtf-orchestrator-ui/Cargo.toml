[package]
name = "rtf-orchestrator-ui"
version.workspace = true
edition.workspace = true

[dependencies]
rtf-core = { path = "../rtf-core" }
rtf-orchestrator-shared = { path = "../rtf-orchestrator-shared" }
rtf-config = { path = "../rtf-config" }

anyhow.workspace = true
askama = { version = "0.16.0", features = ["serde_json"] }
axum.workspace = true
cached.workspace = true
chrono.workspace = true
envy.workspace = true
humantime.workspace = true
reqwest.workspace = true
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

# See the note in `main.rs`: jemalloc returns freed pages to the OS on a decay
# timer, which the glibc allocator used by the Linux runtime image does not.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
insta.workspace = true
simple_test_case.workspace = true
