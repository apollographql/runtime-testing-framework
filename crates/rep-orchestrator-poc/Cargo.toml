[package]
name = "rep-orchestrator"
version.workspace = true
edition.workspace = true

[dependencies]
rtf-config = { path = "../rtf-config" }
rtf-core = { path = "../rtf-core" }
rtf-integrations = { path = "../rtf-integrations" }

anyhow.workspace = true 
axum = { version = "0.8.8", features = ["macros"] }
chrono = { version = "0.4.44", features = ["serde"] }
k8s-openapi = { version = "0.27.1", features = ["schemars", "v1_35"] }
kube = { version = "3.0.1", features = ["aws-lc-rs", "derive", "runtime"] }
kube-runtime = "3.0.1"
schemars.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
serde.workspace = true
tokio-stream = "0.1.18"
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
uuid = { version = "1.21.0", features = ["serde", "v4"] }

[dev-dependencies]
rtf-cli = { path = "../rtf-cli" }
