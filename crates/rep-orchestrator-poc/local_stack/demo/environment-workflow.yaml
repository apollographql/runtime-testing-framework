apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: provision-rtf-environment
  namespace: cluster-api
spec:
  serviceAccountName: argo-workflow
  entrypoint: main
  onExit: cleanup
  arguments:
    parameters:
      - name: namespace-name
        value: "demo-namespace"
      - name: environment-configmap
        value: "rtf-environment-config"
  templates:
    - name: main
      dag:
        tasks:
          - name: create-namespace
            template: create-namespace
            arguments:
              parameters:
                - name: namespace-name
                  value: "{{workflow.parameters.namespace-name}}"
          - name: create-pull-secret
            template: create-pull-secret
            dependencies: [create-namespace]
            arguments:
              parameters:
                - name: namespace-name
                  value: "{{workflow.parameters.namespace-name}}"
          - name: deploy-environment
            template: deploy-environment
            dependencies: [create-pull-secret]
            arguments:
              parameters:
                - name: namespace-name
                  value: "{{workflow.parameters.namespace-name}}"
                - name: environment-configmap
                  value: "{{workflow.parameters.environment-configmap}}"

    - name: create-namespace
      inputs:
        parameters:
          - name: namespace-name
      container:
        image: us-central1-docker.pkg.dev/platform-cross-environment/platform-docker/rtf-toolbox:edge
        command: ["rep-orchestrator-cli"]
        args:
          - create-namespace
          - --namespace
          - "{{inputs.parameters.namespace-name}}"
          - --kubeconfig
          - /kubeconfig/value
        volumeMounts:
          - name: kubeconfig
            mountPath: /kubeconfig
            readOnly: true

    - name: create-pull-secret
      inputs:
        parameters:
          - name: namespace-name
      volumes:
        - name: gcr-secret
          secret:
            secretName: gcr-secret
            items:
              - key: .dockerconfigjson
                path: config.json
      container:
        image: us-central1-docker.pkg.dev/platform-cross-environment/platform-docker/rtf-toolbox:edge
        command: ["rep-orchestrator-cli"]
        args:
          - create-pull-secret
          - --namespace
          - "{{inputs.parameters.namespace-name}}"
          - --kubeconfig
          - /kubeconfig/value
          - --docker-config
          - /gcr-secret/config.json
        volumeMounts:
          - name: kubeconfig
            mountPath: /kubeconfig
            readOnly: true
          - name: gcr-secret
            mountPath: /gcr-secret
            readOnly: true

    - name: deploy-environment
      inputs:
        parameters:
          - name: namespace-name
          - name: environment-configmap
      volumes:
        - name: environment
          configMap:
            name: "{{inputs.parameters.environment-configmap}}"
      container:
        image: us-central1-docker.pkg.dev/platform-cross-environment/platform-docker/rtf-toolbox:edge
        command: ["rep-orchestrator-cli"]
        args:
          - deploy-environment
          - --namespace
          - "{{inputs.parameters.namespace-name}}"
          - --kubeconfig
          - /kubeconfig/value
          - --environment
          - /environment/environment.yaml
        volumeMounts:
          - name: kubeconfig
            mountPath: /kubeconfig
            readOnly: true
          - name: environment
            mountPath: /environment
            readOnly: true

    - name: cleanup
      container:
        image: us-central1-docker.pkg.dev/platform-cross-environment/platform-docker/rtf-toolbox:edge
        command: ["rep-orchestrator-cli"]
        args:
          - cleanup
          - --configmap
          - "{{workflow.parameters.environment-configmap}}"
          - --namespace
          - cluster-api

  volumes:
    - name: kubeconfig
      secret:
        secretName: workload-kubeconfig
