services:
  nginx:
    image: nginx:alpine
    labels:
      kompose.io/init-containers: '[{"name": "toolbox", "volumeMounts": {"name":"providers","mountPath":"/providers","readOnly":false}, "image": "us-central1-docker.pkg.dev/platform-cross-environment/apollo-private-docker/rtf-toolbox:edge", "command": "rep-orchestrator-cli", "args": ["resolve-environment", "--outdir", "/providers"]}]'
    command: >
      cat $EXAMPLE_FILE && sleep infinity
    pull_policy: always
    volumes:
      - providers:/providers

volumes:
  providers:
    driver: local
