apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rep-orchestrator.fullname" . }}
  labels:
    {{- include "rep-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rep-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rep-orchestrator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: rep-orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: RTF_HOST
              value: {{ .Values.config.host | quote }}
            - name: RTF_PORT
              value: {{ .Values.config.port | quote }}
            - name: RTF_APOLLO_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.apolloKey.name is required" .Values.secrets.apolloKey.name }}
                  key: {{ .Values.secrets.apolloKey.key }}
            - name: RTF_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.githubAppId.name is required" .Values.secrets.githubAppId.name }}
                  key: {{ .Values.secrets.githubAppId.key }}
            - name: RTF_GITHUB_APP_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.githubPrivateKey.name is required" .Values.secrets.githubPrivateKey.name }}
                  key: {{ .Values.secrets.githubPrivateKey.key }}
            - name: RTF_DB_HOST
              value: {{ required "db.host is required" .Values.db.host | quote }}
            - name: RTF_DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: RTF_DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: RTF_DB_USER
              value: {{ .Values.db.user | quote }}
            {{- if .Values.db.password }}
            - name: RTF_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.dbPassword.name is required" .Values.secrets.dbPassword.name }}
                  key: {{ .Values.secrets.dbPassword.key }}
            {{- end }}
            {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
            - name: RTF_KUBECONFIG_SECRET_NAME
              value: {{ .Values.k8s.workload.kubeconfigSecretRef.name | quote }}
            {{- end }}
            - name: RTF_KUBECONFIG_PATH
              {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
              value: "/root/.kube/config"
              {{- else if .Values.k8s.workload.kubeconfigPath }}
              value: {{ .Values.k8s.workload.kubeconfigPath | quote }}
              {{- else }}
              {{ fail "Either k8s.workload.kubeconfigSecretRef.name or k8s.workload.kubeconfigPath must be set" }}
              {{- end }}
            {{- if .Values.k8s.management.context }}
            - name: RTF_MGMT_CONTEXT
              value: {{ .Values.k8s.management.context | quote }}
            {{- end }}
            - name: RTF_WORKLOAD_CONTEXT
              value: {{ required "k8s.workload.context is required" .Values.k8s.workload.context | quote }}
            - name: RTF_GCS_BUCKET
              value: {{ required "gcs.bucket is required" .Values.gcs.bucket | quote }}
            - name: RTF_GCS_URL_TTL_SECS
              value: {{ .Values.gcs.urlTtlSecs | quote }}
            - name: RTF_MAX_CONCURRENT_EXECUTIONS
              value: {{ .Values.config.maxConcurrentExecutions | quote }}
            - name: RTF_MAX_QUEUED_EXECUTIONS
              value: {{ .Values.config.maxQueuedExecutions | quote }}
            - name: RTF_ORCHESTRATOR_URL
              value: {{ required "config.orchestratorUrl is required" .Values.config.orchestratorUrl | quote }}
            - name: RTF_TOOLBOX_PULL_POLICY
              value: {{ required "config.toolboxPullPolicy is required" .Values.config.toolboxPullPolicy | quote }}
            {{- if .Values.gcs.mockInternalUrl }}
            - name: RTF_MOCK_INTERNAL_GCS_URL
              value: {{ .Values.gcs.mockInternalUrl | quote }}
            {{- end }}
            {{- if .Values.gcs.mockPublicUrl }}
            - name: RTF_MOCK_PUBLIC_GCS_URL
              value: {{ .Values.gcs.mockPublicUrl | quote }}
            {{- end }}
          {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
          volumeMounts:
            - name: kubeconfig
              mountPath: /root/.kube
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            periodSeconds: 5
        {{- if .Values.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.cloudSqlProxy.image }}
          args:
            - "--structured-logs"
            - "--auto-iam-authn"
            - "--private-ip"
            - "--port={{ .Values.db.port }}"
            - {{ .Values.cloudSqlProxy.instanceConnectionName | quote }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
        {{- end }}
      {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
      volumes:
        - name: kubeconfig
          secret:
            secretName: {{ .Values.k8s.workload.kubeconfigSecretRef.name }}
            items:
              - key: {{ .Values.k8s.workload.kubeconfigSecretRef.key }}
                path: config
      {{- end }}
