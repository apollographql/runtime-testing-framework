image:
  repository: "us-central1-docker.pkg.dev/platform-cross-environment/apollo-private-docker/rep-orchestrator"
  tag: "edge"
  pullPolicy: Always

imagePullSecrets: []

command: []

service:
  create: true
  port: 8035
  type: ClusterIP

gcs:
  bucket: ""    # required
  urlTtlSecs: "300"

secret:
  create: true

# External secret references for Deployment env vars.
# When secret.create=true, name defaults to the chart fullname (the Secret this chart creates).
# When secret.create=false, set name to point at your externally-managed Secret.
secrets:
  apolloKey:
    name: ""          # required
    key: "apollo-key"
  githubAppId:
    name: ""          # required
    key: "github-app-id"
  githubPrivateKey:
    name: ""          # required
    key: "private-key-pem"
  dbPassword:
    name: ""          # required
    key: "db-pass"

config:
  host: "0.0.0.0"
  port: "8035"
  logLevel: "warn"
  apolloKey: "dummy"
  maxConcurrentExecutions: "10"
  maxQueuedExecutions: "100"
  orchestratorUrl: ""   # required; must be reachable from both mgmt and workload cluster pods

github:
  appId: ""            # required; GitHub App ID

db:
  host: ""      # required (set to 127.0.0.1 for cloud SQL proxy)
  port: "5432"
  name: "rtf_rep"
  user: "service_user"
  password: null  # set to enable password auth; omit when using Cloud SQL Proxy IAM auth

serviceAccountName: null  # K8s ServiceAccount name (required for Workload Identity)

k8s:
  management:
    # Kubernetes context name for the management cluster (where Argo workflows run).
    #
    # Two modes:
    #   null (default) — production/in-cluster: the pod's own service account credentials
    #                    are used. No management kubeconfig is required.
    #   "<context>"    — dev/staging: credentials are read from the kubeconfig supplied via
    #                    workload.kubeconfigSecretRef or workload.kubeconfigPath, using this
    #                    context name. That file must contain entries for both clusters.
    context: null

  workload:
    # Required: Kubernetes context name for the workload cluster
    # (where ephemeral test namespaces run).
    context: ""   # required

    # Kubeconfig source — exactly one of the following must be set:
    #
    # Option A: mount a Kubernetes Secret as the kubeconfig.
    # The file lands at /root/.kube/config (derived from the mount; no kubeconfigPath needed).
    kubeconfigSecretRef:
      name: null
      key: "config"

    # Option B: provide the path to a kubeconfig already present in the container
    # (e.g. via a bind mount in dev/CI). Ignored when kubeconfigSecretRef.name is set.
    kubeconfigPath: ""

cloudSqlProxy:
  enabled: false
  # required when enabled (format = project:region:instance)
  instanceConnectionName: "runtime-testing-framework:us-central1:orchestrator-postgres"
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2"
