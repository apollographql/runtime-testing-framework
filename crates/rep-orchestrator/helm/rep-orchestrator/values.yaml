image:
  repository: "us-central1-docker.pkg.dev/platform-cross-environment/platform-docker/rep-orchestrator"
  tag: "edge"
  pullPolicy: Always

imagePullSecrets: []

command: []

service:
  port: 8035
  type: ClusterIP

gcs:
  bucket: ""    # required
  urlTtlSecs: "300"

config:
  host: "0.0.0.0"
  port: "8035"
  logLevel: "warn"
  apolloKey: "dummy"
  maxConcurrentExecutions: "10"
  maxQueuedExecutions: "100"
  orchestratorUrl: ""   # required; must be reachable from both mgmt and workload cluster pods

github:
  appId: ""            # required; GitHub App ID
  privateKeySecret: ""  # required; name of a k8s Secret with key "private-key-pem"

db:
  host: ""      # required
  port: "5432"
  name: "rtf_rep"
  user: "service_user"
  pass: ""      # required

k8s:
  kubeconfigPath: ""     # required
  mgmtContext: ""        # required
  workloadContext: ""    # required
  kubeconfigSecret: ""   # name of a secret with key "config" to mount at kubeconfigPath
