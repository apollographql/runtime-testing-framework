# ServiceAccount referenced by Argo Workflow specs (serviceAccountName: argo-workflow)
# when submitting workflows to the cluster-api namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
  namespace: cluster-api
imagePullSecrets:
  - name: gcr-secret
---
# Argo workflow pods need to create workflowtaskresults to report status back to
# the Argo controller, and read secrets/configmaps mounted as volumes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow
  namespace: cluster-api
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow
  namespace: cluster-api
subjects:
  - kind: ServiceAccount
    name: argo-workflow
    namespace: cluster-api
roleRef:
  kind: Role
  name: argo-workflow
  apiGroup: rbac.authorization.k8s.io
