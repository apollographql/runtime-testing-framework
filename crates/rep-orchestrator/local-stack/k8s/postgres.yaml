apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: orchestrator
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: service_user
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: rtf_rep
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "service_user", "-d", "rtf_rep"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orchestrator
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
