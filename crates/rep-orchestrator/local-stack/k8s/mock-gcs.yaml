apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-gcs
  namespace: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-gcs
  template:
    metadata:
      labels:
        app: mock-gcs
    spec:
      containers:
        - name: mock-gcs
          image: mock-gcs
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mock-gcs
  namespace: orchestrator
spec:
  type: NodePort
  selector:
    app: mock-gcs
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
