apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  annotations:
    rtf.io/file-providers: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          args: ["sh", "-c", "nginx -c ${NGINX_CONF_FILE} -g 'daemon off;'"]
          imagePullPolicy: Always
