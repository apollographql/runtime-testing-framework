apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rtf-orchestrator.fullname" . }}
  labels:
    {{- include "rtf-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rtf-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rtf-orchestrator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "rtf-orchestrator.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: rtf-orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: RTF_CONFIG_PATH
              value: "/etc/rtf-orchestrator/config/config.yaml"
            - name: RTF_APOLLO_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.apolloKey.name is required" .Values.secrets.apolloKey.name }}
                  key: {{ .Values.secrets.apolloKey.key }}
            - name: RTF_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.githubAppId.name is required" .Values.secrets.githubAppId.name }}
                  key: {{ .Values.secrets.githubAppId.key }}
            - name: RTF_GITHUB_APP_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.githubPrivateKey.name is required" .Values.secrets.githubPrivateKey.name }}
                  key: {{ .Values.secrets.githubPrivateKey.key }}
            {{- if .Values.db.password }}
            - name: RTF_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.dbPassword.name is required" .Values.secrets.dbPassword.name }}
                  key: {{ .Values.secrets.dbPassword.key }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/rtf-orchestrator/config
              readOnly: true
            {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
            - name: kubeconfig
              mountPath: /root/.kube
              readOnly: true
            {{- end }}
            {{- if .Values.k8s.routerPerf.kubeconfigSecretRef.name }}
            - name: router-perf-kubeconfig
              mountPath: /etc/rtf-orchestrator/router-perf-kubeconfig
              readOnly: true
            {{- end }}
            {{- if .Values.configMaps.admins }}
            - name: admins
              mountPath: /etc/rtf-orchestrator/admins
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.cloudSqlProxy.image }}
          args:
            {{- range .Values.cloudSqlProxy.args }}
            - {{ . | quote }}
            {{- end }}
            - "--port={{ .Values.db.port }}"
            - {{ .Values.cloudSqlProxy.instanceConnectionName | quote }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ required "configMaps.config is required" .Values.configMaps.config }}
            items:
              - key: config.yaml
                path: config.yaml
        {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.k8s.workload.kubeconfigSecretRef.name }}
            items:
              - key: {{ .Values.k8s.workload.kubeconfigSecretRef.key }}
                path: config
        {{- end }}
        {{- if .Values.k8s.routerPerf.kubeconfigSecretRef.name }}
        - name: router-perf-kubeconfig
          secret:
            secretName: {{ .Values.k8s.routerPerf.kubeconfigSecretRef.name }}
            items:
              - key: {{ .Values.k8s.routerPerf.kubeconfigSecretRef.key }}
                path: config
        {{- end }}
        {{- if .Values.configMaps.admins }}
        - name: admins
          configMap:
            name: {{ .Values.configMaps.admins }}
            items:
              - key: members
                path: members
        {{- end }}
