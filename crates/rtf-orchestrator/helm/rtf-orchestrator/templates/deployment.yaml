apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rtf-orchestrator.fullname" . }}
  labels:
    {{- include "rtf-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rtf-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rtf-orchestrator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "rtf-orchestrator.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: rtf-orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: RTF_HOST
              value: {{ .Values.config.host | quote }}
            - name: RTF_PORT
              value: {{ .Values.config.port | quote }}
            - name: RTF_APOLLO_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.apolloKey.name is required" .Values.secrets.apolloKey.name }}
                  key: {{ .Values.secrets.apolloKey.key }}
            - name: RTF_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.githubAppId.name is required" .Values.secrets.githubAppId.name }}
                  key: {{ .Values.secrets.githubAppId.key }}
            - name: RTF_GITHUB_APP_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.githubPrivateKey.name is required" .Values.secrets.githubPrivateKey.name }}
                  key: {{ .Values.secrets.githubPrivateKey.key }}
            - name: RTF_DB_HOST
              value: {{ required "db.host is required" .Values.db.host | quote }}
            - name: RTF_DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: RTF_DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: RTF_DB_USER
              value: {{ .Values.db.user | quote }}
            {{- if .Values.db.password }}
            - name: RTF_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.dbPassword.name is required" .Values.secrets.dbPassword.name }}
                  key: {{ .Values.secrets.dbPassword.key }}
            {{- end }}
            {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
            - name: RTF_KUBECONFIG_SECRET_NAME
              value: {{ .Values.k8s.workload.kubeconfigSecretRef.name | quote }}
            {{- end }}
            - name: RTF_KUBECONFIG_PATH
              {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
              value: "/root/.kube/config"
              {{- else if .Values.k8s.workload.kubeconfigPath }}
              value: {{ .Values.k8s.workload.kubeconfigPath | quote }}
              {{- else }}
              {{ fail "Either k8s.workload.kubeconfigSecretRef.name or k8s.workload.kubeconfigPath must be set" }}
              {{- end }}
            - name: RTF_ADMINS_PATH
              value: "/etc/rtf-orchestrator/admins/members"
            - name: RTF_WORKLOAD_CONTEXT
              value: {{ required "k8s.workload.context is required" .Values.k8s.workload.context | quote }}
            - name: RTF_GCS_BUCKET
              value: {{ required "gcs.bucket is required" .Values.gcs.bucket | quote }}
            - name: RTF_GCS_URL_TTL_SECS
              value: {{ .Values.gcs.urlTtlSecs | quote }}
            - name: RTF_MAX_CONCURRENT_EXECUTIONS
              value: {{ .Values.config.maxConcurrentExecutions | quote }}
            - name: RTF_MAX_QUEUED_EXECUTIONS
              value: {{ .Values.config.maxQueuedExecutions | quote }}
            - name: RTF_BODY_LIMIT_MB
              value: {{ .Values.config.bodyLimitMb | quote }}
            - name: RTF_ORCHESTRATOR_URL
              value: {{ required "config.orchestratorUrl is required" .Values.config.orchestratorUrl | quote }}
            - name: RTF_TOOLBOX_PULL_POLICY
              value: {{ required "config.toolboxPullPolicy is required" .Values.config.toolboxPullPolicy | quote }}
            - name: RTF_TOOLBOX_IMAGE_REPOSITORY
              value: {{ required "toolboxImage.repository is required" .Values.toolboxImage.repository | quote }}
            - name: RTF_TOOLBOX_IMAGE_TAG
              value: {{ required "toolboxImage.tag is required" .Values.toolboxImage.tag | quote }}
            - name: RTF_FAILED_EXECUTION_TTL_SECS
              value: {{ .Values.config.failedExecutionTtlSecs | quote }}
            - name: RTF_RETRY_WINDOW_SECS
              value: {{ .Values.config.retryWindowSecs | quote }}
            - name: RTF_POLL_INTERVAL_SECS
              value: {{ .Values.config.pollIntervalSecs | quote }}
            - name: RTF_OTEL_COLLECTOR_GRPC
              value: {{ .Values.otel.collectorGrpc | quote }}
            - name: RTF_OTEL_COLLECTOR_HTTP
              value: {{ .Values.otel.collectorHttp | quote }}
            - name: RTF_PROMETHEUS_ENDPOINT
              value: {{ .Values.prometheus.endpoint | quote }}
            {{- if .Values.gcs.mockInternalUrl }}
            - name: RTF_MOCK_INTERNAL_GCS_URL
              value: {{ .Values.gcs.mockInternalUrl | quote }}
            {{- end }}
            {{- if .Values.gcs.mockPublicUrl }}
            - name: RTF_MOCK_PUBLIC_GCS_URL
              value: {{ .Values.gcs.mockPublicUrl | quote }}
            {{- end }}
          {{- if or .Values.k8s.workload.kubeconfigSecretRef.name .Values.configMaps.admins }}
          volumeMounts:
            {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
            - name: kubeconfig
              mountPath: /root/.kube
              readOnly: true
            {{- end }}
            {{- if .Values.configMaps.admins }}
            - name: admins
              mountPath: /etc/rtf-orchestrator/admins
              readOnly: true
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.cloudSqlProxy.enabled }}
        - name: cloud-sql-proxy
          image: {{ .Values.cloudSqlProxy.image }}
          args:
            {{- range .Values.cloudSqlProxy.args }}
            - {{ . | quote }}
            {{- end }}
            - "--port={{ .Values.db.port }}"
            - {{ .Values.cloudSqlProxy.instanceConnectionName | quote }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
        {{- end }}
      {{- if or .Values.k8s.workload.kubeconfigSecretRef.name .Values.configMaps.admins }}
      volumes:
        {{- if .Values.k8s.workload.kubeconfigSecretRef.name }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.k8s.workload.kubeconfigSecretRef.name }}
            items:
              - key: {{ .Values.k8s.workload.kubeconfigSecretRef.key }}
                path: config
        {{- end }}
        {{- if .Values.configMaps.admins }}
        - name: admins
          configMap:
            name: {{ .Values.configMaps.admins }}
            items:
              - key: members
                path: members
        {{- end }}
      {{- end }}
