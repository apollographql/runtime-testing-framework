# -- Cloud SQL proxy sidecar configuration
cloudSqlProxy:
  # -- Whether to enable the Cloud SQL proxy sidecar
  enabled: false
  # -- Cloud SQL instance connection name (format: project:region:instance). Required when enabled
  instanceConnectionName: "runtime-testing-framework:us-central1:orchestrator-postgres"
  # -- Docker image for the Cloud SQL proxy
  image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2"
  # -- Extra flags passed to the Cloud SQL proxy, ahead of the port and instance connection name
  args:
    - "--structured-logs"
    - "--auto-iam-authn"
    - "--private-ip"

# -- Override the container command
command: []

# -- Application configuration
config:
  # -- Log level for the RUST_LOG environment variable
  logLevel: "warn"

# -- External ConfigMap references for Deployment volumes. Set each value to point at your externally-managed ConfigMap
configMaps:
  # -- Name of the ConfigMap containing the admins list (data key: members). When unset, nothing is mounted
  admins: null
  # -- Name of the ConfigMap containing the orchestrator's YAML config file (data key: config.yaml). Required
  config: ""

# -- Cloud SQL proxy sidecar port. Only used when cloudSqlProxy.enabled is true
db:
  # -- Port the Cloud SQL proxy sidecar listens on
  port: "5432"
  # -- Set to a non-null value to enable password authentication; RTF_DB_PASS will be mounted from secrets.dbPassword. Omit when using Cloud SQL Proxy IAM auth
  password: null

# -- Overrides the fully qualified app name
fullnameOverride: ""

# -- Container image configuration
image:
  # -- Image repository
  repository: "us-central1-docker.pkg.dev/platform-cross-environment/apollo-private-docker/rtf-orchestrator"
  # -- Image tag. Defaults to the chart appVersion when not set
  tag: null
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- List of image pull secrets
imagePullSecrets: []

# -- References to Secrets containing kubeconfig files for workload clusters, mounted as volumes.
# The cluster names and contexts used by the orchestrator itself are configured in the config file
# (configMaps.config), not here.
k8s:
  # -- One entry per workload cluster listed under workload_clusters.available_clusters in the
  # config file — `name` must match exactly. Each cluster's kubeconfig Secret is mounted at
  # /etc/rtf-orchestrator/kubeconfigs/<name>/config, which must match
  # WorkloadClusterConfig::kubeconfig_path in src/config.rs. `name` becomes part of a Kubernetes
  # volume name, so it must be a valid DNS-1123 label (lowercase alphanumeric and `-`).
  workloadClusters: []
  # - name: alpha
  #   kubeconfigSecretRef:
  #     # -- Secret name containing the kubeconfig
  #     name: my-kubeconfig-secret
  #     # -- Key within the Secret
  #     key: "config"

# -- Overrides the chart name
nameOverride: ""

# -- Annotations to add to the pod template
podAnnotations: {}

# -- Resource requests and limits for the rtf-orchestrator container
resources: {}

# -- External Secret references for Deployment environment variables. Set name on each block to point at your externally-managed Secret
secrets:
  # -- Apollo key secret reference
  apolloKey:
    # -- Name of the Secret containing the Apollo key. Required
    name: ""
    # -- Key within the Secret
    key: "apollo-key"
  # -- GitHub App ID secret reference
  githubAppId:
    # -- Name of the Secret containing the GitHub App ID. Required
    name: ""
    # -- Key within the Secret
    key: "github-app-id"
  # -- GitHub App private key secret reference
  githubPrivateKey:
    # -- Name of the Secret containing the GitHub App private key. Required
    name: ""
    # -- Key within the Secret
    key: "private-key-pem"
  # -- Database password secret reference. Required when db.password is set
  dbPassword:
    # -- Name of the Secret containing the database password
    name: ""
    # -- Key within the Secret
    key: "db-pass"

# -- Kubernetes Service configuration
service:
  # -- Whether to create a Service resource
  create: true
  # -- Service port
  port: 8035
  # -- Service type
  type: ClusterIP

# -- Service account configuration
serviceAccount:
  # -- Whether to create a ServiceAccount
  create: false
  # -- Name of the ServiceAccount. Defaults to the chart fullname when create is true
  name: ""
  # -- Annotations to add to the ServiceAccount.
  # e.g. iam.gke.io/gcp-service-account: sa@project.iam.gserviceaccount.com
  annotations: {}
