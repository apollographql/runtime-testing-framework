postgresql:
  fullnameOverride: postgres
  auth:
    username: service_user
    password: password
    database: rtf_orchestrator
    postgresPassword: postgres_admin_password
  primary:
    # DB tests open a fresh connection per query and closed connections are slow to free up
    # through the port-forward, so allow headroom above the default of 100.
    extendedConfiguration: |
      max_connections = 400
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
