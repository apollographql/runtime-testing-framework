# ServiceAccount referenced by Argo Workflow specs (serviceAccountName: argo-workflow)
# when submitting workflows to the orchestrator namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-workflow
  namespace: orchestrator
imagePullSecrets:
  - name: gcr-secret
---
# Argo workflow pods need to create workflowtaskresults to report status back to
# the Argo controller, and read secrets/configmaps mounted as volumes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow
  namespace: orchestrator
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-workflow
  namespace: orchestrator
subjects:
  - kind: ServiceAccount
    name: argo-workflow
    namespace: orchestrator
roleRef:
  kind: Role
  name: argo-workflow
  apiGroup: rbac.authorization.k8s.io
---
# Grants the orchestrator pod permission to submit and manage Argo workflows
# in its own namespace (it runs as the default SA in the orchestrator namespace)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-workflow-submitter
  namespace: orchestrator
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-workflow-submitter
  namespace: orchestrator
subjects:
  - kind: ServiceAccount
    name: default
    namespace: orchestrator
roleRef:
  kind: Role
  name: orchestrator-workflow-submitter
  apiGroup: rbac.authorization.k8s.io
