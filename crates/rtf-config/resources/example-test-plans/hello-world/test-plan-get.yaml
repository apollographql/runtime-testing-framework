base:
  kind: local_path
  relative_path: base-test-plan.yaml

values:
  credentials_env_var: "AUTH_HEADER"
  server_command: "python3 server.py"

test_scenario:
  base:
    kind: local_path
    relative_path: scenario-get.yaml

  env_vars:
    VERBOSE: "false"

  injected_files:
    - name: "requests.json"
      mechanism:
        kind: inline
        content: |
          { "endpoint": "hello-world", "status": 200, "resp": { "hello": "world" } }
          { "endpoint": "goodbye-world", "status": 404, "resp": { "error": "not found" } }

environment:
  base:
    kind: local_path
    relative_path: env-local-service.yaml

  file_parameters: []
