name: authenticated-http-test
description: |
  A base test plan for running a simple HTTP request test against a web server
  that requires basic auth.

# Values that must be defined in any scenario that is going to be used with this base test plan
scenario_defines:
  - name: credentials_env_var
    description: "An environment variable that contains a '$user:$pwd' string"
    schema:
      type: string
      pattern: '^[^:]:[^:]$'

# Required output fields from the JSON object returned by a compatible environment provisioner
environment_provides:
  - name: server_url
    description: "The publicly accessible URL for the service under test"
    schema:
      type: string
