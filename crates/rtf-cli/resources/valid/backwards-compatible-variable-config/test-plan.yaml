name: backwards-compatible-variable-config
description: |
  Check that the old names for variables and variable definitions 
  parse successfully

values:
  foo: "foo"
  bar: "bar"

scenario:
  inline:
    name: inline-scenario
    description: an inline scenario
    values:
      - name: foo
        description: A value foo
    command:
      name: scenario.sh
      kind: inline
      content: |
        #!/usr/bin/env sh
        echo "Hello, World!"
    env_vars:
      FOO: "{{ foo }}"

environment:
  inline:
    name: inline-environment
    description: an inline environment
    setup:
      command:
        name: setup.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
