name: resolved values
description: |
  The "ResolvedValues" file provider is a little special in that it returns
  a JSON representation of the resolved values being used by the current
  test plan.

values:
  foo: "bar"

scenario:
  inline:
    name: scenario
    description: "Cat out all of the supplied values"
    values:
      - name: echo_me
        description: "A string to echo out"

    command:
      name: cat-values.sh
      kind: inline
      content: |
        #!/usr/bin/env sh

        cat "$VALUES"

    file_providers:
      - name: values.json
        env_var: VALUES
        kind: resolved_variables

environment:
  inline:
    name: environment-command-from-spec
    description: "Minimal env config since this is not used for the test"
    setup:
      command:
        name: echo-output.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "{}" > "$RTF_OUTPUT"

    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Goodbye, World!"
