name: resolved variables
description: |
  The "ResolvedVariables" file provider is a little special in that it returns
  a JSON representation of the resolved variables being used by the current
  test plan.

variables:
  foo: "bar"

scenario:
  inline:
    name: scenario
    description: "Cat out all of the supplied variables"
    variable_definitions:
      - name: echo_me
        description: "A string to echo out"

    command:
      name: cat-variables.sh
      kind: inline
      content: |
        #!/usr/bin/env sh

        cat "$VARIABLES"

    file_providers:
      - name: variables.json
        env_var: VARIABLES
        kind: resolved_variables

environment:
  inline:
    name: environment-command-from-spec
    description: "Minimal env config since this is not used for the test"
    setup:
      command:
        name: echo-output.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "{}" > "$RTF_OUTPUT"

    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Goodbye, World!"
