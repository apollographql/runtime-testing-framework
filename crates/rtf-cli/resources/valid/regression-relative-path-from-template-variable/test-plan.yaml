name: Regression test for RR-395
description: |
  Should correctly pick up the relative path next to the test plan instead of the
  one next to the scenario. Before the fix introduced in RR-395, relative paths
  set via a template variable were incorrectly resolved relative to the file containing
  the relative_path file provider rather than the source of the template variable.

variables:
  cat_path: "cat-me.txt"

scenario:
  from:
    kind: local
    relative_path: scenario-dir/scenario.yaml

environment:
  inline:
    name: empty
    description: No environment setup is needed for this test
    setup:
      command:
        name: empty.sh
        kind: inline
        content: "#!/usr/bin/env sh"
    teardown:
      command:
        name: empty.sh
        kind: inline
        content: "#!/usr/bin/env sh"
