name: sanity-check
description: |
  Sanity check that we correctly call the specified commands for each stage of a test plan.

variables:
  message: "hello, world!"

scenario:
  from:
    kind: local
    relative_path: nested/scenario.yaml
  overrides:
    file_providers:
      - name: file-provider.txt
        env_var: EXAMPLE_FILE
        kind: relative_path
        path: nested/override-file-provider.txt

environment:
  from:
    kind: local
    relative_path: environment.yaml
