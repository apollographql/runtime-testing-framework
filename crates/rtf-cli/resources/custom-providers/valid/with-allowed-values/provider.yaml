name: provider with allowed values
description: A custom provider that has a variable with restricted allowed values

variable_definitions:
  - name: env_type
    description: The environment type
    default: staging
    allowed_values:
      - dev
      - staging
      - prod

command:
  name: echo-env.sh
  kind: inline
  content: |
    #!/usr/bin/env sh
    echo "Environment: $ENV_TYPE" >> "$RTF_OUTPUT"

env_vars:
  ENV_TYPE: "{{ env_type }}"
