name: provider with file provider
description: A custom provider that uses a nested file provider

variable_definitions: []

command:
  name: cat-file.sh
  kind: inline
  content: |
    #!/usr/bin/env sh
    cat "$INPUT_FILE" >> "$RTF_OUTPUT"

file_providers:
  - name: input.txt
    env_var: INPUT_FILE
    kind: relative_path
    path: data/input.txt
