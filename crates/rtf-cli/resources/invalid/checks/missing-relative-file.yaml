name: relative-file-missing
description: |
  Check the error shown when a relative path file provider is referencing a file
  that does not exist

scenario:
  inline:
    name: inline-scenario
    description: an inline scenario
    command:
      name: scenario.sh
      kind: relative_path
      path: does-not-exist.sh

environment:
  inline:
    name: inline-environment
    description: an inline environment
    setup:
      command:
        name: setup.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
