name: missing-variables
description: |
  Check the error shown when there are template strings using variables not defined in the
  variables section of their config

scenario:
  inline:
    name: inline-scenario
    description: an inline scenario
    command:
      name: scenario.sh
      kind: inline
      content: |
        #!/usr/bin/env sh
        echo "Hello, World!"
    env_vars:
      FOO: "{{ foo }}"

environment:
  inline:
    name: inline-environment
    description: an inline environment
    setup:
      command:
        name: setup.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
      env_vars:
        BAR: "{{ bar }}"
    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
      env_vars:
        BAZ: "{{ baz }}"
