name: setup-file-provider-fails
description: |
  Check the error shown when the setup contains a file provider that fails
  The file is not valid utf-8 which is why this fails

scenario:
  inline:
    name: inline-scenario
    description: an inline scenario
    command:
      name: scenario.sh
      kind: inline
      content: |
        #!/usr/bin/env sh
        echo "Hello, World!"

environment:
  inline:
    name: inline-environment
    description: an inline environment
    setup:
      command:
        name: setup.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
      file_providers:
        - name: frog-no.gif
          env_var: FROG_GIF
          kind: relative_path
          path: frog-no.gif
    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
