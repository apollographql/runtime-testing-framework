name: graphos-supergraph
description: |
  Check that a supergraph can be successfully pulled from GraphOS

scenario:
  inline:
    name: scenario-graphos-supergraph
    description: "Check that a supergraph file can be pulled from GraphOS"
    command: echo {}
    file_providers:
      - name: supergraph.graphql
        env_var: SUPERGRAPH_FILE
        kind: graphos_supergraph
        graph_id: "imgood-observability-test"
        variant: "current"

environment:
  inline:
    name: environment-graphos-supergraph
    description: "Minimal env config since this is not used for the test"
    setup:
      command: echo {}
    teardown:
      command: echo {}
