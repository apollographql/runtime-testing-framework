name: invalid custom provider
description: A custom provider with default not in allowed_values
variable_definitions:
  - name: env_type
    description: the environment type
    default: test
    allowed_values:
      - dev
      - staging
      - prod
command:
  name: custom_provider.sh
  kind: inline
  content: |
    #!/usr/bin/env sh
    echo "$ENV_TYPE" >> "$RTF_OUTPUT"
env_vars:
  ENV_TYPE: "{{ env_type }}"
