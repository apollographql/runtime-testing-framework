name: setup-provides-missing-key
description: |
  Check the error shown when the setup output is missing a key

scenario:
  inline:
    name: inline-scenario
    description: an inline scenario
    command:
      name: scenario.sh
      kind: inline
      content: |
        #!/usr/bin/env sh
        echo "Hello, World!"

environment:
  inline:
    name: inline-environment
    description: an inline environment
    setup:
      command:
        name: setup.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo '{}' > "$RTF_OUTPUT"
      provides:
        - name: setup_output
          description: "a key returned from setup"
    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
