name: malformed-scenario
description: |
  Check the error shown when the scenario yaml is malformed

scenario:
  inline:
    name: inline-scenario
    description: an inline scenario
    command: |
      This should not be a string!

environment:
  inline:
    name: inline-environment
    description: an inline environment
    setup:
      command:
        name: setup.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Hello, World!"
