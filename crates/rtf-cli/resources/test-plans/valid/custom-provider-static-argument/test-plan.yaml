name: custom-provider-static-argument
description: |
  Check that a custom provider can be used with a static (resolved) argument value
  rather than a templated variable reference

custom_providers:
  - kind: local
    relative_path: providers
    using:
      my_custom_provider: my-custom-provider.yaml

scenario:
  from:
    kind: local
    relative_path: scenario/scenario.yaml

environment:
  inline:
    name: environment-custom-provider
    description: "No environment config is required for this test"
    setup:
      command:
        name: setup.sh
        kind: inline
        content: "#!/usr/bin/env sh"

    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: "#!/usr/bin/env sh"
