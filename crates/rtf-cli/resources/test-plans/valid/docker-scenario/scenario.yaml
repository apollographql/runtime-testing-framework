name: scenario-docker-based-scenario
description: Execute a scenario from a docker image

variable_definitions:
  - name: message
    description: "A message to echo out"

docker:
  image: alpine
  tag: latest
  command: "sh $ECHO_MESSAGE"

env_vars:
  MESSAGE: "{{ message }}"
  STAGE: scenario

file_providers:
  - name: echo-message.sh
    env_var: ECHO_MESSAGE
    kind: relative_path
    path: scripts/echo-message.sh
