name: graphos-subgraphs
description: |
  Check that subgraphs can be successfully pulled from GraphOS

scenario:
  inline:
    name: scenario-graphos-subgraphs
    description: "Check that subgraph files can be pulled from GraphOS"
    command:
      name: command.sh
      kind: inline
      content: |
        #!/usr/bin/env sh
        echo "Hello, World!"
    file_providers:
      - name: subgraphs
        env_var: SUBGRAPH_DIR
        kind: graphos_subgraphs
        graph_ref: "imgood-observability-test@current"

environment:
  inline:
    name: environment-graphos-subgraphs
    description: "Minimal env config since this is not used for the test"
    setup:
      command:
        name: echo-output.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "{}" > "$RTF_OUTPUT"

    teardown:
      command:
        name: teardown.sh
        kind: inline
        content: |
          #!/usr/bin/env sh
          echo "Goodbye, World!"
