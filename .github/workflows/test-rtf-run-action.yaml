name: Test RTF Run Action

on: workflow_dispatch

jobs:
  run-sanity-check:
    name: Run sanity check test plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: apollographql/release-tooling/rtf-run-test-plan@8c3a10442bc123a814c1a3c3711094d4cf9cdce0
        with:
          test_plan_path: crates/rtf-cli/resources/test-plans/valid/docker-all/test-plan.yaml
          verbose: true
