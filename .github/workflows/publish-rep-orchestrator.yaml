name: Publish REP Orchestrator Docker Image and Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-rep-orchestrator.yaml"
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish-orchestrator-image:
    name: Build and publish REP Orchestrator image
    uses: apollographql/release-tooling/.github/workflows/build_and_publish.yml@8c3a10442bc123a814c1a3c3711094d4cf9cdce0
    permissions:
      contents: read
      id-token: write
    with:
      image_name: rep-orchestrator
      image_description: "REP orchestrator image used to run service for orchestrating
        RTF test plans on REP"
      platforms: "[{\"platform\":\"linux/amd64\",\"runner\":\"ubuntu-24.04\"},{\"plat\
        form\":\"linux/arm64\",\"runner\":\"ubuntu-24.04-arm\"}]"
      context: .
      dockerfile_location: crates/rep-orchestrator/docker/Dockerfile
      build_args: GIT_SHA=${{ github.sha }}
    secrets: inherit

  publish-helm-chart:
    name: "Build and publish REP Orchestrator Helm Chart"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      # Publishes the chart to apollo-private-helm as `0.0.0+<sha>` (the action's default version).
      # app_version is set to the SHA because the deployment template resolves the image tag from
      # `.Chart.AppVersion` (values.yaml image.tag is null) — it must match the image published by
      # the build_and_publish job above.
      - name: "Publish Helm Chart"
        uses: apollographql/release-tooling/release-helm-internal@60a3d29b04f1d4717fd458f8c0382878f5ec9440
        with:
          chart_path: crates/rep-orchestrator/helm/rep-orchestrator
          app_version: ${{ github.sha }}
