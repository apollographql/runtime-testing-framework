name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io

jobs:
  read-rust-version:
    name: Read Rust version from mise.toml
    runs-on: ubuntu-latest
    outputs:
      rust-version: ${{ steps.get-version.outputs.rust-version }}
    steps:
      - uses: actions/checkout@v4
      - id: get-version
        run: |
          version=$(grep '^rust\s*=' .config/mise/mise.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "rust-version=$version" >> "$GITHUB_OUTPUT"

  test-stable:
    name: Test Rust stable
    runs-on: ubuntu-latest
    needs: [read-rust-version]
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - name: Run tests
      run: cargo test --verbose

  test-beta:
    name: Test Rust beta
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: beta
    - name: Run tests
      run: cargo test --verbose

  test-nightly:
    name: Test Rust nightly
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: nightly
    - name: Run tests
      run: cargo test --verbose

  rustfmt:
    name: Ensure rustfmt is happy
    runs-on: ubuntu-latest
    needs: [read-rust-version]
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        components: rustfmt
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - run: cargo pr-format

  clippy:
    name: Lint the codebase with clippy
    runs-on: ubuntu-latest
    needs: [read-rust-version]
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        components: clippy
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - run: cargo pr-clippy

  rustdoc:
    name: Check that rustdoc is happy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: nightly
    - run: RUSTDOCFLAGS="-D warnings -D rustdoc::broken-intra-doc-links" cargo doc --all-features --workspace --no-deps
  
  spell-check:
    name: Spell check using the typos-cli crate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crate-ci/typos@v1.34.0
      with:
        config: ./.typos.toml

  lint-markdown:
    name: Lint Markdown files with dprint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      # The action takes too long to build if we install all the tools in the repo
      # This deletes the full mise.toml and instead installs dprint only
    - run: rm -f .config/mise/mise.toml
    - uses: jdx/mise-action@v2
      with:
        mise_toml: |
          [tools]
          dprint = "0.48.0"
    - run: dprint check
  
  upload-rtf-binary:
    name: Upload the RTF binary as an artifact
    runs-on: ubuntu-22.04
    needs:
      - read-rust-version
      - test-stable
      - test-beta
      - test-nightly
      - rustfmt
      - clippy
      - rustdoc
      - spell-check
      - lint-markdown

    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    
    # router-scale VM architecture is Linux x86_64 - the ubuntu-latest runner matches the 
    # architecture of the router-scale VM
    # NOTE - this binary will only work on Linux x86_64 architecture
    - name: Build rtf binary (release)
      run: cargo build --release --bin rtf

    - name: Upload rtf binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: rtf-binary
        path: target/release/rtf

  publish-router-scale-subgraph-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/router-scale-subgraph

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./images/router-scale-subgraph
          platforms: linux/x86_64, linux/arm64, macOS/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
