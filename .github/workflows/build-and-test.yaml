name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  RUST_BACKTRACE: 1

jobs:
  read-rust-version:
    name: Read Rust version from mise.toml
    runs-on: ubuntu-latest
    outputs:
      rust-version: ${{ steps.get-version.outputs.rust-version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - id: get-version
        run: |
          version=$(grep '^rust\s*=' .config/mise/mise.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "rust-version=$version" >> "$GITHUB_OUTPUT"

  check-for-updated-rust-files:
    name: Check whether rust files have been updated
    runs-on: ubuntu-latest
    outputs:
      should_run_tests: ${{ steps.check-changes.outputs.should_run }}
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        fetch-depth: 2
    - name: Check for changes in relevant directories and files
      id: check-changes
      run: |
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          # Check if any files in crates/ directory, Cargo.toml or Cargo.lock were changed
          git diff --name-only HEAD^ HEAD | grep -q -E "^crates/|^Cargo\.toml$|^Cargo\.lock$" && echo "should_run=true" >> $GITHUB_OUTPUT || echo "should_run=false" >> $GITHUB_OUTPUT
        fi

  test-stable:
    name: Test Rust stable
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c
      with:
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      with:
        shared-key: "ci-build-${{ hashFiles('**/Cargo.lock') }}"
    - name: Run tests excluding the rep-orchestrator crate
      run: cargo test --workspace --exclude rep-orchestrator

  rustfmt:
    name: Ensure rustfmt is happy
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c
      with:
        components: rustfmt
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      with:
        shared-key: "ci-build-${{ hashFiles('**/Cargo.lock') }}"
    - run: cargo pr-format

  clippy:
    name: Lint the codebase with clippy
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c
      with:
        components: clippy
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      with:
        shared-key: "ci-build-${{ hashFiles('**/Cargo.lock') }}"
    - run: cargo pr-clippy

  rustdoc:
    name: Check that rustdoc is happy
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c
      with:
        rust-version: nightly
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      with:
        shared-key: "ci-build-${{ hashFiles('**/Cargo.lock') }}"
    - run: RUSTDOCFLAGS="-D warnings -D rustdoc::broken-intra-doc-links" cargo doc --all-features --workspace --no-deps
  
  spell-check:
    name: Spell check using the typos-cli crate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - uses: crate-ci/typos@v1.44.0
      with:
        config: ./.typos.toml

  lint-markdown:
    name: Lint Markdown files with dprint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      # The action takes too long to build if we install all the tools in the repo
      # This deletes the full mise.toml and instead installs dprint only
    - run: rm -f .config/mise/mise.toml
    - uses: jdx/mise-action@v2
      with:
        mise_toml: |
          [tools]
          "dprint" = "0.54.0"
    - run: dprint check

  check-doc-types:
    name: Check documentation diataxis types
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - run: ./scripts/check-doc-types.sh

  check-helm-docs:
    name: Check rep-orchestrator helm chart README is in sync
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      # The action takes too long to build if we install all the tools in the repo
      # This deletes the full mise.toml and instead installs only what's needed.
    - run: rm -f .config/mise/mise.toml
    - uses: jdx/mise-action@v2
      with:
        mise_toml: |
          [tools]
          "dprint" = "0.54.0"
          "helm-docs" = "1.13.1"
    - run: ./scripts/check-helm-docs.sh

  check-generated-docs:
    name: Check that generated docs are up to date
    runs-on: ubuntu-latest
    needs: [read-rust-version, check-for-updated-rust-files]
    if: ${{ needs.check-for-updated-rust-files.outputs.should_run_tests == 'true' }}
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
    - uses: hecrj/setup-rust-action@110f36749599534ca96628b82f52ae67e5d95a3c
      with:
        rust-version: ${{ needs.read-rust-version.outputs.rust-version }}
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      with:
        shared-key: "ci-build-${{ hashFiles('**/Cargo.lock') }}"
      # The action takes too long to build if we install all the tools in the repo
      # This deletes the full mise.toml and instead installs dprint only
    - run: rm -f .config/mise/mise.toml
    - uses: jdx/mise-action@v2
      with:
        mise_toml: |
          [tasks.format-markdown]
          run = "dprint fmt"
          [tools]
          "dprint" = "0.54.0"
    - run: |
        ./scripts/generate-docs.sh
        DIFF="$(git diff docs/src/)"
        if [ "$DIFF" = "" ]; then
          echo "Generated docs are up to date"
        else
          echo "WARNING: Generated docs are out of date:"
          echo ">> Diff start"
          echo "$DIFF"
          echo ">> Diff end"
          exit 1
        fi
