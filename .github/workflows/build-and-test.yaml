name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]

    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: ${{ matrix.rust }}

    - name: Run tests
      run: cargo test --verbose

  rustfmt:
    name: Ensure rustfmt is happy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        components: rustfmt
    - run: cargo pr-format

  clippy:
    name: Lint the codebase with clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        components: clippy
    - run: cargo pr-clippy

  rustdoc-links:
    name: Check doc links are valid
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: nightly
    - run: RUSTDOCFLAGS="-D rustdoc::broken-intra-doc-links" cargo doc --all-features --workspace --no-deps
  
  spell-check:
    name: Spell check using the typos-cli crate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: crate-ci/typos@v1.34.0
      with:
        config: ./.typos.toml
  
  upload-rtf-binary:
    name: Upload the RTF binary as an artifact
    runs-on: ubuntu-22.04
    needs:
      - test
      - rustfmt
      - clippy
      - rustdoc-links

    steps:
    - uses: actions/checkout@v4
    - uses: hecrj/setup-rust-action@v2
      with:
        rust-version: stable
    
    # router-scale VM architecture is Linux x86_64 - the ubuntu-latest runner matches the 
    # architecture of the router-scale VM
    # NOTE - this binary will only work on Linux x86_64 architecture
    - name: Build rtf binary (release)
      run: cargo build --release --bin rtf

    - name: Upload rtf binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: rtf-binary
        path: target/release/rtf
