name: Test RTF Orchestrator Run Action

on: workflow_dispatch

jobs:
  run-sanity-check:
    name: Run sanity check test plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: apollographql/release-tooling/rtf-orchestrator-run@6ab89bdcf9cd1a86ecaa85925b75e003405e5edc
        with:
          test_plan_path: crates/rep-orchestrator/resources/test-plans/valid/smoke/test-plan.yaml
          verbose: true
